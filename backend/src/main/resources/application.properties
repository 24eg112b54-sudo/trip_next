spring.application.name=tripnest
server.port=${PORT:${SERVER_PORT:8080}}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.locations=classpath:db/migration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5500,http://127.0.0.1:5500}
app.seed.admin-email=${ADMIN_EMAIL:}
app.seed.admin-password=${ADMIN_PASSWORD:}
server.error.include-stacktrace=never
server.error.include-message=never

