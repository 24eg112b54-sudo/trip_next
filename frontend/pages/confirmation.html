<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking confirmed — TripNest</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><header><a class="brand" href="../index.html">TRIP<span>NEST</span></a></header><main class="form-wrap"><section class="panel" id="confirmation"><p class="eyebrow">RESERVATION CONFIRMED</p><h1>Your stay is booked.</h1><p class="muted">Your reservation is confirmed. Payment is not collected by TripNest.</p><div id="confirmationDetails"></div><a class="text-link" href="bookings.html">View my bookings →</a></section></main><script src="../assets/js/app.js"></script><script>const confirmation=JSON.parse(sessionStorage.getItem('tripnest_confirmation')||'null');document.querySelector('#confirmationDetails').innerHTML=confirmation?`<p><strong>Reference:</strong> ${confirmation.reference}</p><p>${confirmation.checkIn} → ${confirmation.checkOut}</p><p>Subtotal: ₹${(Number(confirmation.totalAmount)-Number(confirmation.taxAmount)).toFixed(2)}</p><p>Tax: ₹${confirmation.taxAmount}</p><h2>Total: ₹${confirmation.totalAmount}</h2>`:'<p class="message">No recent confirmation was found.</p>';</script></body></html>
