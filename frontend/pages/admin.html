<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — TripNest</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><header><a class="brand" href="../index.html">TRIP<span>NEST</span></a><nav><a href="../index.html">Explore</a><button class="link-button" id="logout">Log out</button></nav></header><main class="section"><p class="eyebrow">ADMINISTRATION</p><h1>Manage TripNest</h1><p id="adminMessage" class="message"></p><form id="stayForm" class="panel admin-form"><input type="hidden" id="stayId"><label>Property name<input id="name" required></label><label>Type<input id="type" placeholder="VILLA" required></label><label>City<input id="city" required></label><label>Country<input id="country" required></label><label>Address<input id="address" required></label><label>Short description<input id="shortDescription" required></label><label>Description<textarea id="description" required></textarea></label><label>Nightly price<input id="pricePerNight" type="number" min="0.01" step="0.01" required></label><label>Maximum guests<input id="maxGuests" type="number" min="1" required></label><label>Rating<input id="rating" type="number" min="0" max="5" step="0.1" value="0"></label><label>Image URLs, one per line<textarea id="images"></textarea></label><label>Amenities, comma separated<input id="amenities"></label><div><button>Save stay</button> <button type="button" class="secondary" id="clearForm">Clear</button></div></form><h2>Listings</h2><div id="adminStays" class="booking-list"><p class="muted">Loading…</p></div><h2>Bookings</h2><div id="adminBookings" class="booking-list"><p class="muted">Loading…</p></div></main><script src="../assets/js/app.js"></script></body></html>
