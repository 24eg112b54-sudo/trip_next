<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore stays — TripNest</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><header><a class="brand" href="../index.html">TRIP<span>NEST</span></a><nav><a href="../index.html">Explore</a><a href="dashboard.html">Dashboard</a><a href="bookings.html">My bookings</a><a href="login.html" id="authLink">Sign in</a></nav></header><main class="section"><p class="eyebrow">EXPLORE STAYS</p><h1>Find your next place to stay.</h1><p class="lede">Search real TripNest listings by destination, type, price, rating, and amenities.</p><form id="searchForm" class="search filters"><label>Destination<input id="q" placeholder="City or property name"></label><label>Property type<select id="type"><option value="">All types</option><option value="VILLA">Villa</option><option value="APARTMENT">Apartment</option><option value="LODGE">Lodge</option></select></label><label>Minimum price<input id="minPrice" type="number" min="0" placeholder="Any"></label><label>Maximum price<input id="maxPrice" type="number" min="0" placeholder="Any"></label><label>Minimum rating<input id="minRating" type="number" min="0" max="5" step="0.1" placeholder="Any"></label><label>Sort by<select id="sort"><option value="rating">Top rated</option><option value="priceAsc">Price: low to high</option><option value="priceDesc">Price: high to low</option><option value="name">Name</option></select></label><label>Amenity<input id="amenity" placeholder="WiFi, pool…"></label><button type="submit">Apply filters</button></form><div id="stays" class="grid"><p class="muted">Loading stays…</p></div></main><script src="../assets/js/app.js"></script></body></html>
